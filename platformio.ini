; Central ESP32 fleet firmware — public PlatformIO config (no secrets).
; Local AWS / Wi-Fi overrides: secrets.ini (gitignored).

[platformio]
default_envs = esp32-c61
extra_configs = secrets.ini
description = ESP32 multi-model AWS IoT fleet firmware

[env]
; Official platformio/espressif32 lacks ESP32-C61 boards; pioarduino ships them + IDF 5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
extra_scripts = pre:scripts/ensure_secrets.py
custom_aws_iot_endpoint = YOUR_ENDPOINT-ats.iot.YOUR_REGION.amazonaws.com
custom_aws_provisioning_template = YOUR_FLEET_TEMPLATE_NAME
custom_wifi_ssid = YOUR_WIFI_SSID
custom_wifi_password = YOUR_WIFI_PASSWORD
build_flags =
	-DAPP_VERSION=\"0.1.0\"
	-DAWS_IOT_ENDPOINT=\"${this.custom_aws_iot_endpoint}\"
	-DAWS_PROVISIONING_TEMPLATE=\"${this.custom_aws_provisioning_template}\"
	-DWIFI_SSID=\"${this.custom_wifi_ssid}\"
	-DWIFI_PASSWORD=\"${this.custom_wifi_password}\"

; ESP32-C61-DevKitC-1 — primary board. Thing esp32-c61-01 on fleet/.
[env:esp32-c61]
board = esp32-c61-devkitc1
board_build.flash_size = 8MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
	${env.build_flags}
	-I secrets/devices/esp32-c61-01
	-DDEVICE_MODEL=\"esp32-c61\"
	-DDEVICE_THING_TYPE=\"esp32-c61\"
	-DTHING_NAME=\"esp32-c61-01\"
	-DDEVICE_HAS_STATUS_LCD=0
	-DBOOT_BUTTON_GPIO=9
	-DDEVICE_HAS_CHIP_TEMP=1

; Ideaspark ESP32 OLED-0.96 V3.0 (CH340 + onboard SSD1306).
; Thing ideaspark-oled-01; topics under fleet/<thing>/.
[env:ideaspark-oled]
board = esp32dev
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
	${env.build_flags}
	-I secrets/devices/ideaspark-oled-01
	-DDEVICE_MODEL=\"ideaspark-oled\"
	-DDEVICE_THING_TYPE=\"ideaspark-oled\"
	-DTHING_NAME=\"ideaspark-oled-01\"
	-DDEVICE_HAS_STATUS_LCD=1
	-DLCD_SDA_GPIO=21
	-DLCD_SCL_GPIO=22
	-DLCD_I2C_ADDR=0x3C
	-DBOOT_BUTTON_GPIO=0
	-DDEVICE_HAS_CHIP_TEMP=0

; ESP32-S3 N16R8-class (16MB flash + 8MB PSRAM). USB-UART or native ACM.
; Thing esp32-s3-01; topics under fleet/<thing>/.
; RGB: DevKitC-1 v1.0=GPIO48, v1.1=GPIO38 — boot probes both; override with STATUS_RGB_GPIO.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
	${env.build_flags}
	-I secrets/devices/esp32-s3-01
	-DDEVICE_MODEL=\"esp32-s3\"
	-DDEVICE_THING_TYPE=\"esp32-s3\"
	-DTHING_NAME=\"esp32-s3-01\"
	-DDEVICE_HAS_STATUS_LCD=0
	-DDEVICE_HAS_STATUS_RGB=1
	-DSTATUS_RGB_GPIO=48
	-DSTATUS_RGB_PROBE_ALT=38
	-DBOOT_BUTTON_GPIO=0
	-DDEVICE_HAS_CHIP_TEMP=1

; ESP32-C3-DevKitM-1 class (4MB emb flash, RGB on GPIO8, BOOT GPIO9).
; Thing esp32-c3-01; native USB Serial/JTAG → /dev/ttyACM*.
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
	${env.build_flags}
	-I secrets/devices/esp32-c3-01
	-DDEVICE_MODEL=\"esp32-c3\"
	-DDEVICE_THING_TYPE=\"esp32-c3\"
	-DTHING_NAME=\"esp32-c3-01\"
	-DDEVICE_HAS_STATUS_LCD=0
	-DDEVICE_HAS_STATUS_RGB=1
	-DSTATUS_RGB_GPIO=2
	-DSTATUS_RGB_PROBE_ALT=8
	-DBOOT_BUTTON_GPIO=9
	-DDEVICE_HAS_CHIP_TEMP=1
