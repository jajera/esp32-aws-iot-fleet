---
# Local workflow: no PlatformIO reusable in actionsforge/actions yet.
name: PlatformIO Build

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-hygiene:
    name: Check no secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan tracked and staged paths
        run: ./scripts/check_no_secrets.sh

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-c61, ideaspark-oled, esp32-s3, esp32-c3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            .pio
          key: >-
            pio-${{ runner.os }}-${{ matrix.env }}-${{
            hashFiles('platformio.ini', 'sdkconfig.defaults', 'partitions.csv') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Build
        run: pio run -e ${{ matrix.env }}
